<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRC Data Challenge 2026 - leaderboard</title>
<style>
  :root { color-scheme: light }
  body { margin: 0; background: #fff; color: #111;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 4px }
  p.sub { margin: 0 0 28px; color: #666; font-size: 13px }
  .wrap { overflow-x: auto }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid #eee; white-space: nowrap }
  th { font-weight: 500; color: #666; font-size: 12px; border-bottom: 1px solid #ddd;
       position: sticky; top: 0; background: #fff }
  th:nth-child(2), td:nth-child(2) { text-align: left; width: 100% }
  td.team { font-weight: 500 }
  td.team a { color: inherit; text-decoration: none; border-bottom: 1px solid #d9d9d9 }
  td.team a:hover { border-bottom-color: #111 }
  td.team a:focus-visible { outline: 2px solid #111; outline-offset: 2px; border-radius: 2px }
  td.num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace }
  td.dim { color: #999 }
  tr:hover td { background: #fafafa }
  .banner { display: inline-block; margin: 0 0 24px; padding: 6px 11px; border: 1px solid #e2e2e2;
            border-radius: 4px; background: #fafafa; color: #555; font-size: 12.5px }
  footer { margin-top: 28px; color: #999; font-size: 12px }
  .controls { margin-top: 18px; font-size: 12.5px; color: #555 }
  .controls label { cursor: pointer; user-select: none }
  .controls input { vertical-align: -1px; margin-right: 6px }
  table.hide-single tr.single { display: none }
  #msg { color: #666; padding: 20px 0 }
</style>
</head>
<body>
<main>
  <h1>PRC Data Challenge 2026</h1>
  <p class="sub">Best submission per team.</p>
  <div class="banner" id="age">Loading&hellip;</div>
  <div id="msg">Loading&hellip;</div>
  <div class="wrap">
    <table id="t" hidden>
      <thead><tr>
        <th>#</th><th>Team</th><th>Best</th><th>Subs</th><th>Last activity</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="controls">
    <label><input type="checkbox" id="hs"> Hide teams with a single submission</label>
  </div>
  <footer id="f"></footer>
</main>
<script>
// Requested by espinielli (organiser) 2026-09-08 so this page can be linked from the
// official site: team name -> that team's page. Format given by him verbatim; it could not
// be verified from here because ansperformance.eu returns 403 to every non-browser client,
// including its own dc2026 index, so a wrong name and a real one look identical to curl.
const TEAM_BASE = 'https://ansperformance.eu/study/data-challenge/dc2026/teams/';
const fmt = n => n.toFixed(4);
const ago = iso => {
  const h = (Date.now() - new Date(iso)) / 36e5;
  if (h < 1) return Math.max(0, Math.round(h * 60)) + 'm ago';
  if (h < 48) return Math.round(h) + 'h ago';
  return Math.round(h / 24) + 'd ago';
};
// The competition API sends no access-control-allow-origin, so a browser cannot read it
// directly. prc-leaderboard is a small Fly service in dfw that mirrors it with CORS; it
// scales to zero and refreshes behind the response, so a warm read is instant.
fetch('https://prc-leaderboard.fly.dev/data.json', { cache: 'no-cache' }).then(r => r.json()).then(d => {
  // Rank over EVERY team, so the numbers match the official board. The page used to
  // filter n > 1 before ranking, which shifted every rank below the first single-
  // submission team and, worse, could hide the leader outright: a replay of the board
  // shows 35 moments when the team in first place had exactly one submission, including
  // youthful-giraffe leading on their debut from 2026-09-06 14:27Z to 20:31Z.
  const tb = document.querySelector('#t tbody');
  d.teams.forEach((t, i) => {
    const tr = document.createElement('tr');
    if (t.n === 1) tr.className = 'single';
    tr.innerHTML =
      '<td class="num dim">' + (i + 1) + '</td>' +
      '<td class="team"></td>' +
      '<td class="num">' + fmt(t.best) + '</td>' +
      '<td class="num dim">' + t.n + '</td>' +
      '<td class="num dim">' + ago(t.lastAt) + '</td>';
    // Team names come from the competition API. The label goes in via textContent and the
    // href via encodeURIComponent; this cell is never built with innerHTML.
    const a = document.createElement('a');
    a.href = TEAM_BASE + encodeURIComponent(t.team) + '.html';
    a.textContent = t.team;
    a.rel = 'noopener';
    tr.children[1].appendChild(a);
    tb.appendChild(tr);
  });
  const mins = Math.round((Date.now() - new Date(d.updated)) / 60000);
  const when = mins < 90 ? mins + ' minutes ago'
             : mins < 2880 ? Math.round(mins / 60) + ' hours ago'
             : Math.round(mins / 1440) + ' days ago';
  document.getElementById('age').textContent = 'Data refreshed ' + when + '.';
  document.getElementById('msg').hidden = true;
  document.getElementById('t').hidden = false;
  const singles = d.teams.filter(t => t.n === 1).length;
  const table = document.getElementById('t'), box = document.getElementById('hs');
  const foot = () => document.getElementById('f').textContent =
    (box.checked ? d.teams.length - singles : d.teams.length) + ' teams shown \u00b7 ' +
    singles + ' with a single submission' + (box.checked ? ' (hidden)' : '') + ' \u00b7 ' +
    d.totalSubmissions + ' submissions total \u00b7 as of ' + new Date(d.updated).toUTCString();
  // Per-viewer convenience only; a browser that refuses storage still works normally.
  const apply = () => { table.classList.toggle('hide-single', box.checked); foot();
    try { localStorage.setItem('hideSingle', box.checked ? '1' : '0'); } catch (e) {} };
  try { box.checked = localStorage.getItem('hideSingle') === '1'; } catch (e) {}
  box.addEventListener('change', apply);
  apply();
}).catch(e => { document.getElementById('msg').textContent = 'Could not load: ' + e.message; });
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
